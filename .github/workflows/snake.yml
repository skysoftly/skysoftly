name: Generate Halloween Snake

on:
  schedule:
    - cron: "0 0 * * *" # Запуск каждый день в полночь
  workflow_dispatch: # Позволяет запустить вручную для проверки

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=orange&color_dots=#2b1b0e,#5e2c14,#b85c1a,#f39c12,#f1c40f&color_background=#1a1a1a
            dist/snake-dark.svg?palette=github-dark&color_snake=orange&color_dots=#2b1b0e,#5e2c14,#b85c1a,#f39c12,#f1c40f

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
